[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartwise"
version = "0.1.0"
description = "A tool-calling shopping assistant with retrieval, guardrails, tracing and evals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Shehata" }]
dependencies = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8"]

[project.scripts]
cartwise = "cartwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cartwise = ["data/*.json", "data/policies/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
