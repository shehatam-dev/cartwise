[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cartwise"
version = "0.1.0"
description = "A tool-calling shopping assistant with retrieval, guardrails, tracing and evals."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Shehata" }]
dependencies = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.25"]  # thought_signature and parameters_json_schema
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8", "ruff==0.17.0"]  # pinned so a new lint rule can't turn CI red on its own

[project.urls]
Repository = "https://github.com/shehatam-dev/cartwise"

[project.scripts]
cartwise = "cartwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cartwise = ["data/*.json", "data/policies/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905", "SIM108"]  # a stopword string and a two-branch if read better as written
